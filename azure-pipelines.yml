trigger:
  - main
  - develop

pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: api-devops-secrets
- name: dockerRegistryServiceConnection
  value: 'api-devops-acr'
- name: imageRepository
  value: '$(IMAGE_REPOSITORY)'
- name: containerRegistry
  value: '$(AZURE_CONTAINER_REGISTRY_NAME).azurecr.io'
- name: dockerfilePath
  value: '$(Build.SourcesDirectory)/Dockerfile'
- name: tag
  value: '$(Build.BuildId)'
- name: tagLatest
  value: 'latest'
- name: pythonVersion
  value: '3.11'
- name: appServiceResourceGroup
  value: '$(AZURE_RESOURCE_GROUP)'

stages:
  # ============ BUILD & TEST STAGE ============
  - stage: BuildTest
    displayName: 'Build & Test'
    jobs:
      - job: Build
        displayName: 'Build Python Package'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python $(pythonVersion)'

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            displayName: 'Install dependencies'

          - script: |
              pip install pytest pytest-cov black ruff mypy bandit pbr
            displayName: 'Install dev dependencies'
          
          - script: |
              python -m pytest test/
            displayName: 'Run pytest with coverage'
            continueOnError: false

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(System.DefaultWorkingDirectory)/coverage.xml'
              artifactName: 'coverage-xml'
              publishLocation: 'Container'
            displayName: 'Publish coverage XML as artifact'
            condition: always()

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(System.DefaultWorkingDirectory)/htmlcov'
              artifactName: 'coverage-html'
              publishLocation: 'Container'
            displayName: 'Publish coverage HTML report as artifact'
            condition: always()
          - script: |
              black --check src/ test/
            displayName: 'Black code formatting check'
            continueOnError: true

          - script: |
              ruff check src/ test/
            displayName: 'Ruff linting'
            continueOnError: true

          - script: |
              mypy src/main.py --ignore-missing-imports
            displayName: 'MyPy type checking'
            continueOnError: true

          - script: |
              bandit -r src/ -f json -o bandit-report.json
            displayName: 'Bandit security scan'
            continueOnError: true

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(System.DefaultWorkingDirectory)/bandit-report.json'
              artifactName: 'security-reports'
            displayName: 'Publish security reports'
            condition: always()

  # ============ DOCKER BUILD & PUSH STAGE ============
  - stage: DockerBuildPush
    displayName: 'Docker Build & Push to ACR'
    dependsOn: BuildTest
    condition: succeeded()
    jobs:
      - job: BuildPushDocker
        displayName: 'Build and Push Docker Image'
        steps:
          - task: Docker@2
            displayName: 'Build Docker image'
            inputs:
              command: build
              repository: '$(imageRepository)'
              dockerfile: '$(dockerfilePath)'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              arguments: |
                --build-arg BUILD_DATE=$(Build.BuildId)
                --build-arg VERSION=$(tag)
                --build-arg VCS_REF=$(Build.SourceVersion)
              tags: |
                $(tag)
                $(tagLatest)

          - task: Docker@2
            displayName: 'Push Docker image to ACR'
            inputs:
              command: push
              repository: '$(imageRepository)'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              tags: |
                $(tag)
                $(tagLatest)

          - script: |
              echo "Docker image pushed to: $(containerRegistry)/$(imageRepository):$(tag)"
              echo "Docker image pushed to: $(containerRegistry)/$(imageRepository):$(tagLatest)"
            displayName: 'Output image locations'

  # ============ DEPLOY TO STAGING ============
  - stage: DeployStaging
    displayName: 'Deploy to Staging App Service'
    dependsOn: DockerBuildPush
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - deployment: DeployToStaging
        displayName: 'Deploy to Staging'
        environment: 'staging'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy to Azure App Service (Staging)'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    appName: '$(STAGING_APP_SERVICE_NAME)'
                    imageName: '$(containerRegistry)/$(imageRepository):$(tag)'
                - task: AzureCLI@2
                  displayName: 'Set App Settings (Staging): API_KEY, SECRET_KEY, WEBSITES_PORT'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -euo pipefail
                      if [ -z "$(STAGING_APP_SERVICE_NAME)" ] || [ -z "$(appServiceResourceGroup)" ]; then
                        echo "Missing app service name or resource group"
                        exit 1
                      fi

                      az webapp config appsettings set \
                        -g "$(appServiceResourceGroup)" \
                        -n "$(STAGING_APP_SERVICE_NAME)" \
                        --settings \
                        "API_KEY=$(api-key)" \
                        "SECRET_KEY=$(secret-key)" \
                        "WEBSITES_PORT=8000" \
                        "WEBSITES_CONTAINER_START_TIME_LIMIT=600"

                      az webapp config set \
                        -g "$(appServiceResourceGroup)" \
                        -n "$(STAGING_APP_SERVICE_NAME)" \
                        --generic-configurations '{"healthCheckPath":"/health"}'

                - script: |
                    echo "Deployed to staging: $(STAGING_APP_SERVICE_NAME)"
                  displayName: 'Print deployment info'

  # ============ DEPLOY TO PRODUCTION ============
  - stage: DeployProduction
    displayName: 'Deploy to Production App Service'
    dependsOn: DockerBuildPush
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployToProduction
        displayName: 'Deploy to Production'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy to Azure App Service (Production)'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    appName: '$(PRODUCTION_APP_SERVICE_NAME)'
                    imageName: '$(containerRegistry)/$(imageRepository):$(tag)'
                
                - task: AzureCLI@2
                  displayName: 'Set App Settings (Production): API_KEY, SECRET_KEY, WEBSITES_PORT'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -euo pipefail
                      if [ -z "$(PRODUCTION_APP_SERVICE_NAME)" ] || [ -z "$(appServiceResourceGroup)" ]; then
                        echo "Missing app service name or resource group"
                        exit 1
                      fi

                      az webapp config appsettings set \
                        -g "$(appServiceResourceGroup)" \
                        -n "$(PRODUCTION_APP_SERVICE_NAME)" \
                        --settings \
                        "API_KEY=$(api-key)" \
                        "SECRET_KEY=$(secret-key)" \
                        "WEBSITES_PORT=8000" \
                        "WEBSITES_CONTAINER_START_TIME_LIMIT=600"

                      az webapp config set \
                        -g "$(appServiceResourceGroup)" \
                        -n "$(PRODUCTION_APP_SERVICE_NAME)" \
                        --generic-configurations '{"healthCheckPath":"/health"}'

                - script: |
                    echo "Deployed to production: $(PRODUCTION_APP_SERVICE_NAME)"
                    echo "Image: $(containerRegistry)/$(imageRepository):$(tag)"
                  displayName: 'Print production deployment info'

